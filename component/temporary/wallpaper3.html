<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesh Gradient Wallpaper</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

const VS = `
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

// 12 blobs — GLSL arrays must be compile-time constant size
const FS = `
precision highp float;

uniform vec2  u_res;
uniform float u_time;
uniform vec2  u_bp[12];
uniform vec3  u_bc[12];
uniform vec2  u_mouse;
uniform float u_mpull;

float gauss(float d2, float sigma) {
  return exp(-d2 / (2.0 * sigma * sigma));
}

vec3 vibrance(vec3 c, float strength) {
  float mx = max(c.r, max(c.g, c.b));
  float mn = min(c.r, min(c.g, c.b));
  float sat = mx - mn;
  return c + (c - vec3((mx + mn) * 0.5)) * strength * (1.0 - sat);
}

void main() {
  vec2 uv = gl_FragCoord.xy / u_res;
  uv.y = 1.0 - uv.y;
  vec2 asp = vec2(u_res.x / u_res.y, 1.0);

  // Warp UV toward mouse — squeezes blobs together, blending colors
  vec2 toMouse = u_mouse - uv;
  float mdist = length(toMouse * asp);
  float warp = u_mpull * 0.38 * exp(-mdist * mdist / (2.0 * 0.28 * 0.28));
  vec2 warpedUV = uv + toMouse * warp;

  vec3 col = vec3(0.0);
  float wsum = 0.0;

  for (int i = 0; i < 12; i++) {
    // Each blob is pulled toward mouse too — nearby ones converge
    vec2 blobToMouse = u_mouse - u_bp[i];
    float bdist = length(blobToMouse * asp);
    float bpull = u_mpull * 0.5 * exp(-bdist * bdist / (2.0 * 0.35 * 0.35));
    vec2 bp = u_bp[i] + blobToMouse * bpull;

    vec2 d = (warpedUV - bp) * asp;
    float w = gauss(dot(d,d), 0.36);
    col   += u_bc[i] * w;
    wsum  += w;
  }

  col /= max(wsum, 0.0001);

  col = vibrance(col, 0.55);

  float grain = fract(sin(dot(gl_FragCoord.xy, vec2(127.1, 311.7)) + u_time * 0.01) * 43758.5453) * 0.016 - 0.008;
  col += grain;

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    console.error(gl.getShaderInfoLog(s));
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {};
['u_res','u_time','u_bp','u_bc','u_mouse','u_mpull'].forEach(n => {
  U[n] = gl.getUniformLocation(prog, n);
});

// ── 12 blobs — one vivid representative from each palette zone ──────────────
const BLOBS = [
  { p: [0.08, 0.15],  c: [1.00, 0.30, 0.52] },  // hot pink
  { p: [0.55, 0.10],  c: [0.55, 0.15, 0.98] },  // electric violet
  { p: [0.90, 0.25],  c: [0.20, 0.78, 1.00] },  // cyan sky
  { p: [0.78, 0.60],  c: [0.05, 0.20, 0.90] },  // vivid navy blue
  { p: [0.50, 0.38],  c: [0.25, 0.95, 0.45] },  // neon green
  { p: [0.20, 0.55],  c: [0.00, 0.85, 0.75] },  // vivid teal
  { p: [0.05, 0.72],  c: [1.00, 0.48, 0.05] },  // vivid orange
  { p: [0.35, 0.88],  c: [0.95, 0.08, 0.18] },  // vivid crimson
  { p: [0.65, 0.82],  c: [0.70, 0.05, 1.00] },  // vivid purple
  { p: [0.90, 0.85],  c: [1.00, 0.20, 0.80] },  // hot magenta
  { p: [0.45, 0.65],  c: [1.00, 0.85, 0.30] },  // vivid yellow
  { p: [0.22, 0.30],  c: [0.10, 0.10, 0.65] },  // deep indigo
];

const DRIFT = BLOBS.map((b, i) => ({
  ox: b.p[0], oy: b.p[1],
  ax: 0.22 + (i % 3) * 0.08,
  ay: 0.18 + (i % 4) * 0.07,
  px: (i * 1.37) % (Math.PI * 2),
  py: (i * 2.11) % (Math.PI * 2),
  sp: 0.18 + (i % 5) * 0.04,
}));

const colors = BLOBS.map(b => [...b.c]);

// ── Mouse ────────────────────────────────────────────────────────────────────
let mouseX = window.innerWidth  * 0.5;
let mouseY = window.innerHeight * 0.5;
let smx = mouseX, smy = mouseY;
let pull = 0, tpull = 0;

window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; tpull = 1; });
window.addEventListener('mouseleave', () => { tpull = 0; });

function resize() {
  canvas.width  = Math.floor(window.innerWidth  * devicePixelRatio);
  canvas.height = Math.floor(window.innerHeight * devicePixelRatio);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// ── Render ───────────────────────────────────────────────────────────────────
const t0 = performance.now();
function lerp(a, b, k) { return a + (b - a) * k; }

function render(now) {
  const t = (now - t0) * 0.001;

  smx = lerp(smx, mouseX, 0.05);
  smy = lerp(smy, mouseY, 0.05);
  pull = lerp(pull, tpull, 0.04);

  const positions = DRIFT.map(d => [
    d.ox + Math.sin(t * d.sp + d.px) * d.ax,
    d.oy + Math.cos(t * d.sp * 0.85 + d.py) * d.ay,
  ]);

  gl.uniform2f(U.u_res, canvas.width, canvas.height);
  gl.uniform1f(U.u_time, t);
  gl.uniform2fv(U.u_bp, positions.flat());
  gl.uniform3fv(U.u_bc, colors.flat());
  gl.uniform2f(U.u_mouse, smx / window.innerWidth, smy / window.innerHeight);
  gl.uniform1f(U.u_mpull, pull);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
